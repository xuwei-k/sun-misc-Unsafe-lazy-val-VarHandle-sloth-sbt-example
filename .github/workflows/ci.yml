on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: zulu
    - uses: sbt/setup-sbt@v1
    - run: sbt
           -v
           --server
           run
           testFull
